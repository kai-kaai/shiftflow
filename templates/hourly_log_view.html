<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ดูตาราง Log (Full Screen)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="log-view-page">

    <div class="log-view-loading" id="loading-indicator">กำลังดาวน์โหลดข้อมูลตารางเวร...</div>

    <div id="table-container" class="log-table-panel">
        <p class="log-view-scroll-hint" id="log-scroll-hint">เลื่อนซ้าย-ขวาเพื่อดูตารางทั้งหมด</p>
        <div class="log-table-scale-host" id="log-table-scale-host">
            <div class="log-table-scale-wrapper" id="log-table-scale-wrapper">
                <div class="log-table-container">
                    <table id="hourly-log-table"></table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const shiftId = urlParams.get('id');

        if (!shiftId) {
            document.getElementById('loading-indicator').innerText = "ข้อผิดพลาด: ไม่พบ ID ของตารางเวร";
        } else {
            loadHourlyLogData(shiftId);
        }

        function getCleanInitials(fullName) {
            if (!fullName) return '';
            const match = fullName.trim().toUpperCase().match(/^[A-Z]{2,3}/);
            return match ? match[0] : fullName.trim().toUpperCase();
        }

        function loadHourlyLogData(id) {
            let fetchUrl = `/api/shifts/${id}/hourly-log`;
            if (id.startsWith('template:')) {
                const typeSlug = id.split(':')[1].replace('/', '_').replace('+', '_');
                fetchUrl = `/api/templates/${typeSlug}/hourly-log`;
            }

            fetch(fetchUrl)
                .then(res => {
                    if (!res.ok) throw new Error("ไม่สามารถโหลดประวัติตารางเวรนี้ได้");
                    return res.json();
                })
                .then(data => {
                    if (data.error) throw new Error(data.error);

                    document.title = `Log Table - ${data.date_display} (${data.shift_type})`;
                    renderTable(data);

                    document.getElementById('loading-indicator').style.display = 'none';
                    document.getElementById('table-container').classList.add('is-visible');
                    requestAnimationFrame(() => {
                        requestAnimationFrame(scheduleFitAfterLoad);
                    });
                })
                .catch(err => {
                    document.getElementById('loading-indicator').innerText = `เกิดข้อผิดพลาด: ${err.message}`;
                });
        }

        function renderTable(data) {
            const table = document.getElementById('hourly-log-table');
            table.innerHTML = '';

            const isMorning = data.shift_type === 'M8/A14';
            const tbody = document.createElement('tbody');

            const dateHeaderFontSize = '24pt';
            const dateHeaderPadding = '10px 0';
            const headerFontSize = '11pt';
            const headerPadding = '8px';
            const slotFontSize = '11pt';
            const slotPadding = '8px';
            const empFontSize = '11pt';
            const empPadding = '8px';
            const taskFontSize = isMorning ? '10pt' : '14pt';
            const taskPadding = '8px';

            if (isMorning) {
                table.style.maxWidth = '1400px';
                const r1 = document.createElement('tr');
                r1.innerHTML = `
                    <td colspan="14" style="padding: ${dateHeaderPadding}; font-weight: bold; font-size: ${dateHeaderFontSize}; border: 2px solid #000000; text-align: center; background: #FFFFFF; color: #000000;">
                        M8 ${data.date_display}
                    </td>
                `;
                tbody.appendChild(r1);

                const r2 = document.createElement('tr');
                const displayHours = data.hours.slice(0, 12);
                r2.innerHTML = `
                    <td style="background: #FFFFFF; color: #000000; padding: ${headerPadding}; border-left: 2px solid #000000; border-right: 1px solid #A6A6A6; border-bottom: 2px solid #000000; text-align: center; font-weight: bold; font-size: ${headerFontSize}; width: 100px; min-width: 100px;"></td>
                    <td style="background: #FFFFFF; color: #000000; padding: ${headerPadding}; border-right: 2px solid #000000; border-bottom: 2px solid #000000; text-align: center; font-weight: bold; font-size: ${headerFontSize}; width: 100px; min-width: 100px;"></td>
                    ${displayHours.map((h, i) => {
                        const isLast = (i === displayHours.length - 1);
                        const borderRight = isLast ? '2px solid #000000' : '1px solid #A6A6A6';
                        return `<td style="background: #FFFFFF; color: #000000; padding: ${headerPadding}; border-right: ${borderRight}; border-bottom: 2px solid #000000; text-align: center; font-weight: normal; font-size: ${headerFontSize}; min-width: 100px; width: 100px;">${h}</td>`;
                    }).join('')}
                `;
                tbody.appendChild(r2);

                data.rows.forEach((row, rIdx) => {
                    const tr = document.createElement('tr');
                    const isLastRow = (rIdx === data.rows.length - 1);
                    const borderBottom = isLastRow ? '2px solid #000000' : '1px solid #A6A6A6';

                    const slotCell = `<td style="padding: ${slotPadding}; border-left: 2px solid #000000; border-right: 1px solid #A6A6A6; border-bottom: ${borderBottom}; text-align: center; font-weight: bold; font-size: ${slotFontSize}; background: ${row.slot_bg || '#FFFFFF'}; color: #000000;">${row.slot}</td>`;
                    const empCell = `<td style="padding: ${empPadding}; border-right: 2px solid #000000; border-bottom: ${borderBottom}; text-align: center; font-weight: bold; font-size: ${empFontSize}; background: ${row.employee_bg || '#FFFFFF'}; color: #000000;">${row.employee || ''}</td>`;

                    let hourlyCells = '';
                    if (row.slot === 'W/S M8') {
                        const mergeCellVal = row.cells[0]?.value || '';
                        const bgMergeColor = row.cells[0]?.bg_color || '';
                        const bgMerge = bgMergeColor ? `background-color: ${bgMergeColor};` : 'background-color: #FFFFFF;';
                        hourlyCells = `<td colspan="12" style="padding: ${taskPadding}; text-align: center; font-size: ${taskFontSize}; font-weight: bold; ${bgMerge} color: #000000; border-right: 2px solid #000000; border-bottom: ${borderBottom};">${mergeCellVal}</td>`;
                    } else {
                        const displayCells = row.cells.slice(0, 12);
                        hourlyCells = displayCells.map((cell, cIdx) => {
                            const isLastCol = (cIdx === displayCells.length - 1);
                            const borderRight = isLastCol ? '2px solid #000000' : '1px solid #A6A6A6';
                            const bgMergeColor = cell.bg_color || '';
                            const bg = bgMergeColor ? `background-color: ${bgMergeColor};` : 'background-color: #FFFFFF;';
                            return `<td style="padding: ${taskPadding}; text-align: center; font-size: ${taskFontSize}; font-weight: normal; ${bg} color: #000000; border-right: ${borderRight}; border-bottom: ${borderBottom};">${cell.value || ''}</td>`;
                        }).join('');
                    }

                    tr.innerHTML = slotCell + empCell + hourlyCells;
                    tbody.appendChild(tr);
                });

            } else {
                table.style.maxWidth = '1700px';
                const r1 = document.createElement('tr');
                r1.innerHTML = `
                    <td colspan="${data.hours.length + 2}" style="padding: ${dateHeaderPadding}; font-weight: bold; font-size: ${dateHeaderFontSize}; border: 2px solid #000000; text-align: center; background: #FFFFFF; color: #000000;">
                        A ${data.date_display}
                    </td>
                `;
                tbody.appendChild(r1);

                const r2 = document.createElement('tr');
                r2.innerHTML = `
                    <td style="background: #FFFFFF; color: #000000; padding: ${headerPadding}; border-left: 2px solid #000000; border-right: 1px solid #A6A6A6; border-bottom: 2px solid #000000; text-align: center; font-weight: bold; font-size: ${headerFontSize}; width: 100px; min-width: 100px;"></td>
                    <td style="background: #FFFFFF; color: #000000; padding: ${headerPadding}; border-right: 2px solid #000000; border-bottom: 2px solid #000000; text-align: center; font-weight: bold; font-size: ${headerFontSize}; width: 100px; min-width: 100px;"></td>
                    ${data.hours.map((h, i) => {
                        const isLast = (i === data.hours.length - 1);
                        const borderRight = isLast ? '2px solid #000000' : '1px solid #A6A6A6';
                        return `<td style="background: #FFFFFF; color: #000000; padding: ${headerPadding}; border-right: ${borderRight}; border-bottom: 2px solid #000000; text-align: center; font-weight: normal; font-size: ${headerFontSize}; min-width: 100px; width: 100px;">${h}</td>`;
                    }).join('')}
                `;
                tbody.appendChild(r2);

                const afternoonRows = data.rows.slice(0, 6);
                afternoonRows.forEach((row, rIdx) => {
                    const tr = document.createElement('tr');
                    const isLastRow = (rIdx === afternoonRows.length - 1);
                    const borderBottom = isLastRow ? '2px solid #000000' : '1px solid #A6A6A6';

                    const slotCell = `<td style="padding: ${slotPadding}; border-left: 2px solid #000000; border-right: 1px solid #A6A6A6; border-bottom: ${borderBottom}; text-align: center; font-weight: bold; font-size: ${slotFontSize}; background: ${row.slot_bg || '#FFFFFF'}; color: #000000;">${row.slot}</td>`;
                    const empCell = `<td style="padding: ${empPadding}; border-right: 2px solid #000000; border-bottom: ${borderBottom}; text-align: center; font-weight: bold; font-size: ${empFontSize}; background: ${row.employee_bg || '#FFFFFF'}; color: #000000;">${row.employee || ''}</td>`;

                    const hourlyCells = row.cells.map((cell, cIdx) => {
                        const isLastCol = (cIdx === row.cells.length - 1);
                        const borderRight = isLastCol ? '2px solid #000000' : '1px solid #A6A6A6';
                        const bgMergeColor = cell.bg_color || '';
                        const bg = bgMergeColor ? `background-color: ${bgMergeColor};` : 'background-color: #FFFFFF;';
                        return `<td style="padding: ${taskPadding}; text-align: center; font-size: ${taskFontSize}; font-weight: normal; ${bg} color: #000000; border-right: ${borderRight}; border-bottom: ${borderBottom};">${cell.value || ''}</td>`;
                    }).join('');

                    tr.innerHTML = slotCell + empCell + hourlyCells;
                    tbody.appendChild(tr);
                });

                const r3 = document.createElement('tr');
                r3.innerHTML = `
                    <td colspan="${data.hours.length + 2}" style="padding: ${dateHeaderPadding}; font-weight: bold; font-size: ${dateHeaderFontSize}; border: 2px solid #000000; text-align: center; background: #FFFFFF; color: #000000;">
                        N ${data.date_display}
                    </td>
                `;
                tbody.appendChild(r3);

                const r4 = document.createElement('tr');
                r4.innerHTML = `
                    <td style="background: #FFFFFF; color: #000000; padding: ${headerPadding}; border-left: 2px solid #000000; border-right: 1px solid #A6A6A6; border-bottom: 2px solid #000000; text-align: center; font-weight: bold; font-size: ${headerFontSize}; width: 100px; min-width: 100px;"></td>
                    <td style="background: #FFFFFF; color: #000000; padding: ${headerPadding}; border-right: 2px solid #000000; border-bottom: 2px solid #000000; text-align: center; font-weight: bold; font-size: ${headerFontSize}; width: 100px; min-width: 100px;"></td>
                    ${data.hours.map((h, i) => {
                        const isLast = (i === data.hours.length - 1);
                        const borderRight = isLast ? '2px solid #000000' : '1px solid #A6A6A6';
                        return `<td style="background: #FFFFFF; color: #000000; padding: ${headerPadding}; border-right: ${borderRight}; border-bottom: 2px solid #000000; text-align: center; font-weight: normal; font-size: ${headerFontSize}; min-width: 100px; width: 100px;">${h}</td>`;
                    }).join('')}
                `;
                tbody.appendChild(r4);

                const nightRows = data.rows.slice(6);
                nightRows.forEach((row, rIdx) => {
                    const tr = document.createElement('tr');
                    const isLastRow = (rIdx === nightRows.length - 1);
                    const borderBottom = isLastRow ? '2px solid #000000' : '1px solid #A6A6A6';

                    const slotCell = `<td style="padding: ${slotPadding}; border-left: 2px solid #000000; border-right: 1px solid #A6A6A6; border-bottom: ${borderBottom}; text-align: center; font-weight: bold; font-size: ${slotFontSize}; background: ${row.slot_bg || '#FFFFFF'}; color: #000000;">${row.slot}</td>`;
                    const empCell = `<td style="padding: ${empPadding}; border-right: 2px solid #000000; border-bottom: ${borderBottom}; text-align: center; font-weight: bold; font-size: ${empFontSize}; background: ${row.employee_bg || '#FFFFFF'}; color: #000000;">${row.employee || ''}</td>`;

                    let hourlyCells = '';
                    if (row.slot === 'W/S N') {
                        const normalCells = row.cells.slice(0, 3).map((cell, cIdx) => {
                            const borderRight = '1px solid #A6A6A6';
                            const bgMergeColor = cell.bg_color || '';
                            const bg = bgMergeColor ? `background-color: ${bgMergeColor};` : 'background-color: #FFFFFF;';
                            return `<td style="padding: ${taskPadding}; text-align: center; font-size: ${taskFontSize}; font-weight: normal; ${bg} color: #000000; border-right: ${borderRight}; border-bottom: ${borderBottom};">${cell.value || ''}</td>`;
                        }).join('');

                        const mergeCellVal = row.cells[3]?.value || '';
                        const bgMergeColor = row.cells[3]?.bg_color || '';
                        const bgMerge = bgMergeColor ? `background-color: ${bgMergeColor};` : 'background-color: #FFFFFF;';
                        const mergedCell = `<td colspan="${data.hours.length - 3}" style="padding: ${taskPadding}; text-align: center; font-size: ${taskFontSize}; font-weight: bold; ${bgMerge} color: #000000; border-right: 2px solid #000000; border-bottom: ${borderBottom};">${mergeCellVal}</td>`;

                        hourlyCells = normalCells + mergedCell;
                    } else {
                        hourlyCells = row.cells.map((cell, cIdx) => {
                            const isLastCol = (cIdx === row.cells.length - 1);
                            const borderRight = isLastCol ? '2px solid #000000' : '1px solid #A6A6A6';
                            const bgMergeColor = cell.bg_color || '';
                            const bg = bgMergeColor ? `background-color: ${bgMergeColor};` : 'background-color: #FFFFFF;';
                            return `<td style="padding: ${taskPadding}; text-align: center; font-size: ${taskFontSize}; font-weight: normal; ${bg} color: #000000; border-right: ${borderRight}; border-bottom: ${borderBottom};">${cell.value || ''}</td>`;
                        }).join('');
                    }

                    tr.innerHTML = slotCell + empCell + hourlyCells;
                    tbody.appendChild(tr);
                });
            }

            table.appendChild(tbody);
        }

        const LOG_VIEW_TABLET_MAX = 1366;
        const LOG_VIEW_DESKTOP_COMPACT_MAX = 1023;
        const compactLogViewportQuery = window.matchMedia(
            `(max-width: ${LOG_VIEW_TABLET_MAX}px), (max-height: ${LOG_VIEW_TABLET_MAX}px)`
        );
        const touchLogViewportQuery = window.matchMedia('(hover: none), (pointer: coarse)');
        let resizeTimer = null;

        function getLogViewportWidth() {
            return window.visualViewport?.width ?? window.innerWidth;
        }

        function getLogViewportHeight() {
            return window.visualViewport?.height ?? window.innerHeight;
        }

        function isCompactLogViewport() {
            const width = getLogViewportWidth();
            const height = getLogViewportHeight();
            const minSide = Math.min(width, height);
            const maxSide = Math.max(width, height);

            if (touchLogViewportQuery.matches) {
                return maxSide <= LOG_VIEW_TABLET_MAX;
            }

            return minSide <= LOG_VIEW_DESKTOP_COMPACT_MAX;
        }

        function scheduleFitLogTable() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(fitLogTableToViewport, 150);
        }

        function resetLogTableFit() {
            const root = document.documentElement;
            const page = document.body;
            const host = document.getElementById('log-table-scale-host');
            const wrapper = document.getElementById('log-table-scale-wrapper');
            const hint = document.getElementById('log-scroll-hint');

            if (wrapper) {
                wrapper.style.transform = '';
                wrapper.style.width = '';
                wrapper.style.height = '';
            }
            if (host) {
                host.style.width = '';
                host.style.height = '';
            }
            page.classList.remove('log-table-fit');
            page.style.height = '';
            page.style.maxHeight = '';
            root.classList.remove('log-view-fit-root');
            if (hint) hint.style.display = '';
        }

        function fitLogTableToViewport() {
            const root = document.documentElement;
            const page = document.body;
            const host = document.getElementById('log-table-scale-host');
            const wrapper = document.getElementById('log-table-scale-wrapper');
            const container = host?.querySelector('.log-table-container');
            const table = document.getElementById('hourly-log-table');
            const hint = document.getElementById('log-scroll-hint');

            if (!host || !wrapper || !table || !table.rows.length) return;

            resetLogTableFit();

            if (!isCompactLogViewport()) {
                if (hint) hint.style.display = 'none';
                return;
            }

            if (hint) hint.style.display = 'none';

            const pageStyle = getComputedStyle(page);
            const pagePadX = parseFloat(pageStyle.paddingLeft) + parseFloat(pageStyle.paddingRight);
            const pagePadY = parseFloat(pageStyle.paddingTop) + parseFloat(pageStyle.paddingBottom);
            const containerStyle = container ? getComputedStyle(container) : null;
            const containerPadX = containerStyle
                ? parseFloat(containerStyle.paddingLeft) + parseFloat(containerStyle.paddingRight)
                : 0;
            const containerBorderX = containerStyle
                ? parseFloat(containerStyle.borderLeftWidth) + parseFloat(containerStyle.borderRightWidth)
                : 0;

            const viewportWidth = getLogViewportWidth();
            const viewportHeight = getLogViewportHeight();
            const fitBuffer = touchLogViewportQuery.matches ? 12 : 8;
            const availableWidth = viewportWidth - pagePadX - fitBuffer;
            const availableHeight = viewportHeight - pagePadY - fitBuffer;
            const naturalWidth = table.offsetWidth + containerPadX + containerBorderX;

            wrapper.style.width = `${naturalWidth}px`;
            wrapper.style.height = 'auto';
            const naturalHeight = wrapper.getBoundingClientRect().height;

            if (!naturalWidth || !naturalHeight || !availableWidth || !availableHeight) {
                return;
            }

            const scaleX = availableWidth / naturalWidth;
            const scaleY = availableHeight / naturalHeight;
            const scale = Math.min(scaleX, scaleY, 1);

            if (scale >= 0.999) {
                if (hint) hint.style.display = 'none';
                return;
            }

            const scaledWidth = naturalWidth * scale;
            const scaledHeight = naturalHeight * scale;

            page.classList.add('log-table-fit');
            root.classList.add('log-view-fit-root');
            page.style.height = `${viewportHeight}px`;
            page.style.maxHeight = `${viewportHeight}px`;
            host.style.width = `${scaledWidth}px`;
            host.style.height = `${scaledHeight}px`;
            wrapper.style.width = `${naturalWidth}px`;
            wrapper.style.height = `${naturalHeight}px`;
            wrapper.style.transform = `scale(${scale})`;
            wrapper.style.transformOrigin = 'top left';
        }

        function scheduleFitAfterLoad() {
            fitLogTableToViewport();
            [120, 350, 700].forEach((delay) => {
                setTimeout(fitLogTableToViewport, delay);
            });
        }

        window.addEventListener('resize', scheduleFitLogTable);
        window.addEventListener('orientationchange', () => {
            requestAnimationFrame(scheduleFitAfterLoad);
        });

        if (compactLogViewportQuery.addEventListener) {
            compactLogViewportQuery.addEventListener('change', scheduleFitLogTable);
        } else if (compactLogViewportQuery.addListener) {
            compactLogViewportQuery.addListener(scheduleFitLogTable);
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', scheduleFitLogTable);
            window.visualViewport.addEventListener('scroll', scheduleFitLogTable);
        }
    </script>
</body>
</html>
